site_name: OSCO - Open Security Capability Ontology
site_description: A comprehensive ontology for security capabilities, discoveries, and detections
repo_url: https://github.com/IterativeSecurity/OSCO
repo_name: IterativeSecurity/OSCO
edit_uri: edit/main/

theme:
  name: material
  palette:
    - scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - toc.integrate
    - search.suggest
    - search.highlight

plugins:
  - search
  - macros

markdown_extensions:
  - admonition
  - codehilite
  - meta
  - toc:
      permalink: true
  - pymdownx.arithmatex
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.critic
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:pymdownx.emoji.twemoji
      emoji_generator: !!python/name:pymdownx.emoji.to_svg
  - pymdownx.highlight:
      use_pygments: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

nav:
  - Home: index.md
  - Getting Started:
    - Overview: vision.md
    - Architecture: architecture.md
    - Quick Start: examples.md
  - Ontology:
    - Capabilities: capability/README.md
    - Discoveries: discovery/README.md
    - Detections: detection/README.md
    - Object Definitions: object-definitions.md
    - Field Reference: field-reference.md
    - Relation Types: relation-types.md
  - Guides:
    - Capability Authoring: capability-authoring-guide.md
    - Discovery Guide: discovery-guide.md
    - Detection & Verification: verification-guide.md
    - Provider Authoring: provider-authoring-guide.md
    - Mapping Guide: mapping-guide.md
  - Data:
    - Capability Catalog: capability/catalog.md
    - Discovery Catalog: discovery/catalog.md
    - Detection Catalog: detection/catalog.md
    - Provider Registry: provider/README.md
    - Mappings: mappings/README.md
  - Community:
    - Contributing: CONTRIBUTING.md
    - Code of Conduct: CODE_OF_CONDUCT.md
    - Security Policy: SECURITY.md
    - Governance: governance.md
    - Best Practices: best-practices.md

extra:
  version:
    provider: mike
