name: Component Docs Coverage CI

on:
  pull_request:
    paths:
      - "**/*.md"
      - "scripts/generate_component_docs_report.py"
      - ".github/workflows/component-docs.yml"
  push:
    branches:
      - main
    paths:
      - "**/*.md"
      - "scripts/generate_component_docs_report.py"
      - ".github/workflows/component-docs.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  docs-coverage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Set up Python with uv
        uses: ./.github/actions/setup-python-uv
        with:
          python-version: "3.13"

      - name: Generate docs coverage report
        run: uv run scripts/generate_component_docs_report.py --write

      - name: Upload docs coverage artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: component-doc-coverage
          path: docs/component-doc-coverage.md

      - name: Verify docs coverage and report freshness
        run: uv run scripts/generate_component_docs_report.py --check

      - name: Verify generated report is committed (PR)
        if: github.event_name == 'pull_request'
        run: |
          git diff -- docs/component-doc-coverage.md
          git diff --exit-code -- docs/component-doc-coverage.md

      - name: Commit updated coverage report (main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: ./.github/actions/commit-if-changed
        with:
          files: docs/component-doc-coverage.md
          commit-message: "docs: regenerate component documentation coverage report"
