name: GitHub Pages Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'capability/**'
      - 'discovery/**'
      - 'detection/**'
      - 'mkdocs.yml'
      - '.github/workflows/pages.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'capability/**'
      - 'discovery/**'
      - 'detection/**'
      - 'mkdocs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0

      - name: Set up Python with uv
        uses: ./.github/actions/setup-python-uv
        with:
          python-version: "3.13"

      - name: Install mkdocs dependencies
        run: |
          uv pip install mkdocs mkdocs-material pymdown-extensions mkdocs-macros-plugin mkdocs-redirects
      - name: Prepare docs directory
        run: |
          # Copy repo-root files referenced in nav into docs/
          cp CONTRIBUTING.md CODE_OF_CONDUCT.md SECURITY.md docs/
          # Copy data directories referenced in nav into docs/
          cp -r capability docs/capability
          cp -r discovery docs/discovery
          cp -r detection docs/detection
          cp -r provider docs/provider
          cp -r mappings docs/mappings
      - name: Build documentation
        run: uv run mkdocs build

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: 'site'

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
