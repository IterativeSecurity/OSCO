name: GitHub Pages Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'capability/**'
      - 'discovery/**'
      - 'detection/**'
      - 'mkdocs.yml'
      - '.github/workflows/pages.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'capability/**'
      - 'discovery/**'
      - 'detection/**'
      - 'mkdocs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Set up Python with uv
        uses: ./.github/actions/setup-python-uv
        with:
          python-version: "3.13"

      - name: Install mkdocs dependencies
        run: |
          uv pip install mkdocs mkdocs-material pymdown-extensions mkdocs-macros-plugin

      - name: Build documentation
        run: mkdocs build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@1eb3cb007d329ee3a2fb1a290c0ff1da3600e267 # v3
        with:
          path: 'site'

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@87c3283f3c82b9dc1169a0417be3158b6d6c6e84 # v2
