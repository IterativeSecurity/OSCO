name: Generate Docs CI

on:
  pull_request:
    paths:
      - "capability/catalog.json"
      - "capability/catalog.extended.json"
      - "discovery/discoveries.json"
      - "detection/detections.json"
      - "osco/generators/**"
      - "scripts/generate_*.py"
      - ".github/workflows/generate-docs.yml"
  push:
    branches:
      - main
    paths:
      - "capability/catalog.json"
      - "capability/catalog.extended.json"
      - "discovery/discoveries.json"
      - "detection/detections.json"
      - "osco/generators/**"
      - "scripts/generate_*.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0

      - name: Set up Python with uv
        uses: ./.github/actions/setup-python-uv
        with:
          python-version: "3.13"

      - name: Generate all catalogs
        run: make generate

      - name: Upload generated artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: generated-catalogs
          path: |
            capability/catalog.md
            capability/catalog.extended.md
            discovery/catalog.md
            detection/catalog.md

      - name: Check generated files are committed (PR)
        if: github.event_name == 'pull_request'
        run: |
          git diff -- capability/catalog.md discovery/catalog.md detection/catalog.md
          git diff --exit-code -- capability/catalog.md discovery/catalog.md detection/catalog.md
